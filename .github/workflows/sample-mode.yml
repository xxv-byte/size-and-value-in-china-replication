name: sample-mode
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sample-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Data layout check (synthetic sample)
        run: python scripts/check_data_layout.py --data-dir data/sample
      - name: Unit tests and evidence export
        run: python scripts/export_test_results.py --milestone CI --out docs/testing/ci-results.json --label "CI sample mode" --quiet
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: docs/testing/ci-results.json
          if-no-files-found: warn
